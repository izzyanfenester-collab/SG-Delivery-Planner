name: Build SG Delivery 853 Panda Live Voice Fix Private Testing Base
on:
  push:
    branches: [feature/build-853-panda-live-voice-fix-testing]
    paths: ['app/**','.github/workflows/build-853-panda-live-voice-fix-testing.yml']
permissions:
  contents: read
concurrency:
  group: sg-delivery-b853-private-packaging
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: python3 scripts/build_postal_seed.py
      - name: Unit tests, build, lint
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug lintDebug
      - name: Export base APK and local Android SDK signing tools
        run: |
          set -euo pipefail
          mkdir -p private-packaging
          cp app/build/outputs/apk/debug/app-debug.apk private-packaging/base.apk
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" private-packaging/
          cp "$ANDROID_HOME/build-tools/36.0.0/zipalign" private-packaging/
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging private-packaging/base.apk | grep "package: name='com.izzyan.sgdeliveryplanner.b853test'"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify private-packaging/base.apk
      - uses: actions/upload-artifact@v4
        with:
          name: B853-Private-Packaging-Base
          path: private-packaging/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: B853-Verification-Reports
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
