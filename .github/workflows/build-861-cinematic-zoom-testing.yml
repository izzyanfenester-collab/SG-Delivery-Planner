name: Build and publish B861 Ultra-Smooth Cinematic GPS Auto Zoom TESTING
on:
  push:
    branches: [feature/build-861-cinematic-gps-zoom]
    paths: ['app/**','.github/workflows/build-861-cinematic-zoom-testing.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: b861-testing
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: python3 scripts/build_postal_seed.py
      - name: Import approved voice assets from verified B857 FIXED APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/b857"
          gh release download v1.4.45-b857 --pattern SG-Delivery-B857-Official.apk --dir "$RUNNER_TEMP/b857"
          echo "f5d215ef9ca67f603c45da61f553254953fd2248a5a0a16c449c479f47467819  $RUNNER_TEMP/b857/SG-Delivery-B857-Official.apk" | sha256sum -c -
          python3 - <<'PY'
          import zipfile,os,pathlib,json
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'b857/SG-Delivery-B857-Official.apk'
          root='assets/voicepacks/panda_warrior_v2/'
          with zipfile.ZipFile(p) as z:
              m=json.loads(z.read(root+'manifest.json'))
              assert len(m['clips'])==185
              for n in z.namelist():
                  if n.startswith(root) and not n.endswith('/'):
                      dest=pathlib.Path('app/src/main')/n
                      dest.parent.mkdir(parents=True,exist_ok=True)
                      dest.write_bytes(z.read(n))
          PY
      - name: Test, build and lint
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug lintDebug
      - name: Verify isolated testing package and native alignment
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          bt="$ANDROID_HOME/build-tools/36.0.0"
          mkdir -p dist
          "$bt/aapt" dump badging "$apk" | grep -F "package: name='com.izzyan.sgdeliveryplanner.b861test' versionCode='65' versionName='1.4.49-b861-testing'"
          "$bt/zipalign" -c -P 16 -v 4 "$apk" > dist/alignment.txt
          tail -1 dist/alignment.txt
          "$bt/apksigner" verify --verbose "$apk"
          python3 - <<'PY'
          import os,zipfile,json,hashlib,pathlib
          root='assets/voicepacks/panda_warrior_v2/'
          with zipfile.ZipFile('app/build/outputs/apk/debug/app-debug.apk') as a, zipfile.ZipFile(pathlib.Path(os.environ['RUNNER_TEMP'])/'b857/SG-Delivery-B857-Official.apk') as b:
              assert a.testzip() is None
              files=[n for n in b.namelist() if n.startswith(root) and not n.endswith('/')]
              assert len(json.loads(a.read(root+'manifest.json'))['clips'])==185
              assert all(a.read(n)==b.read(n) for n in files)
              assert any(n.startswith('lib/arm64-v8a/') for n in a.namelist())
              assert any(n.startswith('lib/armeabi-v7a/') for n in a.namelist())
          PY
          cp "$apk" dist/SG-Delivery-B861-TESTING.apk
          sha256sum dist/SG-Delivery-B861-TESTING.apk
      - uses: actions/upload-artifact@v4
        with:
          name: B861-TESTING-APK
          path: dist/SG-Delivery-B861-TESTING.apk
          if-no-files-found: error
      - name: Publish testing prerelease only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag=v1.4.49-b861-testing
          gh release create "$tag" dist/SG-Delivery-B861-TESTING.apk --target "$GITHUB_SHA" --prerelease --latest=false --title "SG Delivery #861 TESTING – Ultra-Smooth Cinematic GPS Auto Zoom" --notes "Isolated B861 GPS camera TESTING package based on B860 TESTING (which builds on B857 Official FIXED). Preserves all six B860 smart zoom modes while animating directly to the full zoom target with cinematic timing, GPS-update deduplication, smooth retargets and critical-junction override. No Official merge. Original 185 Panda Warrior V2 clips preserved from B857 FIXED."
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: B861-verification-reports
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
