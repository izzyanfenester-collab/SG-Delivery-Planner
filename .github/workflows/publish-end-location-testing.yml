name: Publish End Location Testing APK
on:
  push:
    branches:
      - feature/b785-independent-end-location
  workflow_dispatch:
permissions:
  contents: write
jobs:
  testing-apk:
    if: github.ref == 'refs/heads/feature/b785-independent-end-location'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: chmod +x gradlew
      - name: Verify and build testing APK
        run: ./gradlew testDebugUnitTest assembleDebug lintDebug
      - name: Publish downloadable testing prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          output="$RUNNER_TEMP/SG-Delivery-B785-EndLocation-Testing.apk"
          cp "$apk" "$output"
          gh release create "testing-b785-independent-end" "$output" \
            --target "$GITHUB_SHA" \
            --title "SG Delivery – End Location (Build #785 Testing)" \
            --notes "Testing preview based on official Build #785. Start and End are separate, with End defaulting to the last optimized delivery. Not merged or official. Note: this debug APK may have a different signature from the official signed app; back up data before changing installations." \
            --prerelease --latest=false
