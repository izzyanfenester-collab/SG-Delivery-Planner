name: Build Singapore Offline Road Graph (OSM)

on:
  push:
    branches: [feature/build-832-offline-50-road-optimizer]
    paths:
      - 'scripts/build_sg_road_graph.py'
      - '.github/workflows/sg-offline-road-network.yml'
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install OSM extract and PBF parser
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool
          python3 -m pip install --disable-pip-version-check osmium
      - name: Download permitted source PBF (Geofabrik, not public map tile servers)
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --connect-timeout 30 --max-time 850 \
            https://download.geofabrik.de/asia/malaysia-singapore-brunei-latest.osm.pbf \
            --output source.osm.pbf
          test -s source.osm.pbf
          osmium fileinfo -e source.osm.pbf
      - name: Extract Singapore and border approach roads
        run: |
          set -euo pipefail
          osmium extract -b 103.54,1.12,104.19,1.52 source.osm.pbf \
            -o singapore.osm.pbf --overwrite
          test -s singapore.osm.pbf
          rm -f source.osm.pbf
      - name: Build and verify compact directed road graph
        run: |
          set -euo pipefail
          export SG_VERSION=$(date -u +%Y%m%d)
          echo "SG_VERSION=$SG_VERSION" >> "$GITHUB_ENV"
          python3 scripts/build_sg_road_graph.py singapore.osm.pbf \
            --output "SG-Offline-Roads-$SG_VERSION.zip" --version "$SG_VERSION"
          python3 - <<'PY'
          import hashlib, json, os, zipfile
          from pathlib import Path
          version = os.environ["SG_VERSION"]
          package = Path(f"SG-Offline-Roads-{version}.zip")
          with zipfile.ZipFile(package) as z:
              meta = json.loads(z.read("metadata.json"))
              graph = z.read("sg-routing.bin")
          assert meta["graph"]["nodes"] >= 1000
          assert meta["graph"]["edges"] >= 1000
          assert len(graph) == meta["graph"]["bytes"]
          assert hashlib.sha256(graph).hexdigest() == meta["graph"]["sha256"]
          assert package.stat().st_size <= 180 * 1024 * 1024
          payload = {
              "version": version,
              "url": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/sg-offline-data/{package.name}",
              "bytes": package.stat().st_size,
              "sha256": hashlib.sha256(package.read_bytes()).hexdigest(),
              "graph_sha256": meta["graph"]["sha256"],
              "graph_bytes": meta["graph"]["bytes"],
              "nodes": meta["graph"]["nodes"],
              "source": meta["source"],
              "generated_at": meta["built_at"],
              "turn_restrictions": meta["graph"]["turn_restrictions"],
              "via_way_restrictions_unhandled": meta["graph"]["via_way_restrictions_unhandled"]
          }
          Path("latest.json").write_text(json.dumps(payload, indent=2) + "\n")
          print(json.dumps(payload, indent=2))
          PY
      - name: Upload testing offline package
        uses: actions/upload-artifact@v4
        with:
          name: SG-Singapore-Offline-Road-Package
          path: |
            SG-Offline-Roads-*.zip
            latest.json
          if-no-files-found: error
          retention-days: 30
      - name: Publish verified package only from official main
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view sg-offline-data >/dev/null 2>&1; then
            gh release create sg-offline-data --target "$GITHUB_SHA" \
              --title "Singapore Offline Road Graph (OSM, ODbL)" \
              --notes "Generated from © OpenStreetMap contributors via Geofabrik. Driving graph only: not an offline visual basemap or GPS navigation. Local graph handles motor-vehicle access, one-way streets and supported via-node restrictions; via-way restrictions remain unsupported."
          fi
          gh release upload sg-offline-data "SG-Offline-Roads-$SG_VERSION.zip" --clobber
          gh release upload sg-offline-data latest.json --clobber
