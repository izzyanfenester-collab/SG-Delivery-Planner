name: Build SG Delivery Native iOS Unsigned IPA
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/build-ios-unsigned.yml'
jobs:
  unsigned-ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Compile iPhone app without signing
        working-directory: ios
        run: xcodebuild -project SGDeliveryV3.xcodeproj -scheme SGDeliveryV3 -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned IPA
        working-directory: ios
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/SGDeliveryV3.app"
          test -d "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          /usr/bin/zip -qr SG-Delivery-V3-UNSIGNED.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: SG-Delivery-V3-UNSIGNED-IPA
          path: ios/SG-Delivery-V3-UNSIGNED.ipa
          retention-days: 14
