name: Import Build 841 supplied GPS icon assets
on:
  push:
    branches: [feature/build-841-navigation-signs-testing]
    paths:
      - 'scripts/import_navigation_signs841.py'
      - '.github/workflows/import-navigation-signs841.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    if: github.ref == 'refs/heads/feature/build-841-navigation-signs-testing'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/build-841-navigation-signs-testing
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'CairoSVG==2.7.1' 'Pillow==11.3.0'
      - run: python scripts/import_navigation_signs841.py
      - name: Commit the 21 PNG resources to testing branch
        run: |
          git add app/src/main/res/drawable-nodpi/nav_*.png
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Import 21 supplied yellow diamond GPS sign PNG assets"
            git push origin HEAD:feature/build-841-navigation-signs-testing
          fi
