name: Publish verified SG Delivery B864 Official
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-b864-official.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sg-delivery-b864-official-publish
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Assert official main contains the exact owner-approved B864 app source
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          expected={
              'app/src/main/java/com/izzyan/sgdeliveryplanner/PandaVoiceMapper.kt',
              'app/src/main/java/com/izzyan/sgdeliveryplanner/WholeDistanceVoiceScheduler.kt',
              'app/src/test/java/com/izzyan/sgdeliveryplanner/PandaVoice857Test.kt',
              'app/src/test/java/com/izzyan/sgdeliveryplanner/WholeDistanceVoice864Test.kt',
          }
          changed=set(subprocess.check_output(
              ['git','diff','--name-only','2b04348d098689a1e5181ba3c0f9b12cbf03e249','HEAD','--','app/src'],text=True).splitlines())
          assert changed==expected, f'B864 source scope verification failed: {changed ^ expected}'
          print('B863 Official source preserved; only approved B864 voice changes applied.')
          PY
          grep -F 'applicationId = "com.izzyan.sgdeliveryplanner"' app/build.gradle.kts
          grep -F 'versionCode = 68; versionName = "1.4.52-b864"' app/build.gradle.kts
          echo "Only approved B864 voice distance mapper, scheduler and tests differ from B863 Official."
      - run: python3 scripts/build_postal_seed.py
      - name: Import verified original Panda Warrior V2 from B857 Official FIXED
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/b857"
          gh release download v1.4.45-b857 --pattern SG-Delivery-B857-Official.apk --dir "$RUNNER_TEMP/b857"
          echo "f5d215ef9ca67f603c45da61f553254953fd2248a5a0a16c449c479f47467819  $RUNNER_TEMP/b857/SG-Delivery-B857-Official.apk" | sha256sum -c -
          python3 - <<'PY'
          import json, os, pathlib, zipfile
          apk = pathlib.Path(os.environ['RUNNER_TEMP']) / 'b857/SG-Delivery-B857-Official.apk'
          prefix = 'assets/voicepacks/panda_warrior_v2/'
          with zipfile.ZipFile(apk) as z:
              m = json.loads(z.read(prefix + 'manifest.json'))
              assert len(m['clips']) == 185
              assert z.testzip() is None
              for name in z.namelist():
                  if name.startswith(prefix) and not name.endswith('/'):
                      path = pathlib.Path('app/src/main') / name
                      path.parent.mkdir(parents=True, exist_ok=True)
                      path.write_bytes(z.read(name))
          PY
      - name: Full unit tests, lint and unsigned release compilation
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug assembleRelease
      - name: Restore original official JKS signing key securely
        shell: bash
        env:
          SG_DELIVERY_KEYSTORE_BASE64: ${{ secrets.SG_DELIVERY_KEYSTORE_BASE64 }}
          SG_DELIVERY_KEYSTORE_PASSWORD: ${{ secrets.SG_DELIVERY_KEYSTORE_PASSWORD }}
          SG_DELIVERY_KEY_ALIAS: ${{ secrets.SG_DELIVERY_KEY_ALIAS }}
          SG_DELIVERY_KEY_PASSWORD: ${{ secrets.SG_DELIVERY_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for key in SG_DELIVERY_KEYSTORE_BASE64 SG_DELIVERY_KEYSTORE_PASSWORD SG_DELIVERY_KEY_ALIAS SG_DELIVERY_KEY_PASSWORD; do
            if [[ -z "${!key:-}" ]]; then
              echo "::error::Missing protected signing secret: $key"
              exit 1
            fi
          done
          umask 077
          printf '%s' "$SG_DELIVERY_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sg-delivery-b864.jks"
          test -s "$RUNNER_TEMP/sg-delivery-b864.jks"
      - name: Align native libraries to 16 KB and sign with original Official identity
        shell: bash
        env:
          SG_DELIVERY_KEYSTORE_PASSWORD: ${{ secrets.SG_DELIVERY_KEYSTORE_PASSWORD }}
          SG_DELIVERY_KEY_ALIAS: ${{ secrets.SG_DELIVERY_KEY_ALIAS }}
          SG_DELIVERY_KEY_PASSWORD: ${{ secrets.SG_DELIVERY_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          bt="$ANDROID_HOME/build-tools/36.0.0"
          unsigned=app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$unsigned"
          mkdir -p dist
          "$bt/zipalign" -P 16 -f -v 4 "$unsigned" dist/b864-aligned-unsigned.apk >/dev/null
          "$bt/apksigner" sign \
            --ks "$RUNNER_TEMP/sg-delivery-b864.jks" \
            --ks-key-alias "$SG_DELIVERY_KEY_ALIAS" \
            --ks-pass env:SG_DELIVERY_KEYSTORE_PASSWORD \
            --key-pass env:SG_DELIVERY_KEY_PASSWORD \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --out dist/SG-Delivery-B864-Official.apk dist/b864-aligned-unsigned.apk
          rm -f dist/b864-aligned-unsigned.apk
          "$bt/apksigner" verify --verbose --print-certs dist/SG-Delivery-B864-Official.apk | tee dist/signing-verification.txt
          grep -F 'Signer #1 certificate SHA-256 digest: b70d1c964fb4e59c6bc44aee694e25dd893fa77eb877a4b29646cf33786e3e99' dist/signing-verification.txt
          "$bt/aapt" dump badging dist/SG-Delivery-B864-Official.apk | grep -F "package: name='com.izzyan.sgdeliveryplanner' versionCode='68' versionName='1.4.52-b864'"
          "$bt/zipalign" -c -P 16 -v 4 dist/SG-Delivery-B864-Official.apk | tail -1 | grep -F 'Verification successful'
          python3 - <<'PY'
          import zipfile, pathlib, json, os
          root='assets/voicepacks/panda_warrior_v2/'
          new=pathlib.Path('dist/SG-Delivery-B864-Official.apk')
          old=pathlib.Path(os.environ['RUNNER_TEMP'])/'b857/SG-Delivery-B857-Official.apk'
          with zipfile.ZipFile(new) as n, zipfile.ZipFile(old) as o:
              assert n.testzip() is None
              paths=[p for p in o.namelist() if p.startswith(root) and not p.endswith('/')]
              assert len(json.loads(n.read(root+'manifest.json'))['clips']) == 185
              assert all(n.read(p)==o.read(p) for p in paths)
              assert any(p.startswith('lib/arm64-v8a/') for p in n.namelist())
              assert any(p.startswith('lib/armeabi-v7a/') for p in n.namelist())
          print('Panda V2 all files byte-identical; both native ABIs present; APK CRC valid.')
          PY
          sha256sum dist/SG-Delivery-B864-Official.apk
      - uses: actions/upload-artifact@v4
        with:
          name: B864-Official-Verified-APK
          path: dist/SG-Delivery-B864-Official.apk
          if-no-files-found: error
      - name: Publish approved stable release, never change B857 or testing releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag=v1.4.52-b864
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Official B864 release already exists: do not overwrite."
            exit 1
          fi
          gh release create "$tag" dist/SG-Delivery-B864-Official.apk \
            --target "$GITHUB_SHA" --latest \
            --title "SG Delivery Build #863 Official – Ultimate Ultra-Smooth GPS Camera Zoom" \
            --notes "Owner approved B864 TESTING as Official. B863 Official GPS cinematic camera, smooth balanced zoom and all other navigation/delivery/payment functions preserved. Spoken navigation distance announcements use integer kilometres (25km, 19km, 10km, 5km, 1km) and metres below 1km (900m, 800m, 500m, 200m, 100m, 50m), never decimal kilometres. Actual GPS/routing/ETA precision remains unchanged. Original Panda Warrior V2 185 audio clips and Official signing identity retained. Package com.izzyan.sgdeliveryplanner, versionCode 68; signed and 16KB-aligned; users can update existing Official without uninstalling. Testing package data remain isolated."
          gh release view "$tag" --json tagName,isPrerelease,isDraft,assets
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/sg-delivery-b864.jks"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: B864-Official-CI-Verification
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
            dist/signing-verification.txt
