name: SG Delivery iPhone Simulator Integration Tests
on:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/test-ios-simulator.yml'
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/test-ios-simulator.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate iOS project
        working-directory: ios
        run: xcodegen generate
      - name: Run camera, XLSX, Android ZIP and GPS math tests in iPhone Simulator
        working-directory: ios
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list devices available
          DEVICE="$(xcrun simctl list -j devices available | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; print(next(d["udid"] for group in devices.values() for d in group if d["name"].startswith("iPhone") and d.get("isAvailable",True)))')"
          xcodebuild -project SGDeliveryV3.xcodeproj \
            -scheme SGDeliveryV3 \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$DEVICE" \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO test
