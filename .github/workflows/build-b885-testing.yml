name: SG Delivery B885 Lane Guidance and Then TESTING
on:
  push:
    branches: [feature/build-885-lane-then-testing]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: b885-lane-then-testing
  cancel-in-progress: true
jobs:
  build:
    if: github.ref == 'refs/heads/feature/build-885-lane-then-testing'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        with: {packages: platform-tools, log-accepted-android-sdk-licenses: false}
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.13'}
      - name: Audit exact Official baseline and bounded visual guidance changes
        run: python3 scripts/verify_b885_testing.py source
      - name: Restore all unchanged Official data and voice recordings
        run: |
          curl -fL --retry 3 https://github.com/izzyanfenester-collab/SG-Delivery-Planner/releases/download/v1.4.72-b884/SG-Delivery-B884-Official.apk -o "$RUNNER_TEMP/B884-Official.apk"
          python3 scripts/verify_b885_testing.py restore "$RUNNER_TEMP/B884-Official.apk"
      - name: Compile isolated APK, original regressions, new guidance tests and lint
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleDebugAndroidTest testDebugUnitTest lintDebug
      - name: Enable emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Replay recorded GPS, capture native guidance and preserve History actions
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot-save -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash scripts/run_b885_native.sh
      - name: Verify APK assets, identity, signing, alignment and native evidence
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          bt="$ANDROID_HOME/build-tools/36.0.0"
          "$bt/aapt" dump badging "$apk" | head -1 | tee dist/apk-identity.txt
          grep -F "package: name='com.izzyan.sgdeliveryplanner.b885test' versionCode='93' versionName='1.4.73-b885-testing'" dist/apk-identity.txt
          "$bt/apksigner" verify --verbose --print-certs "$apk" > dist/signing-verification.txt
          "$bt/zipalign" -c -P 16 -v 4 "$apk" > dist/zipalign-verification.txt
          python3 scripts/verify_b885_testing.py verify "$RUNNER_TEMP/B884-Official.apk" "$apk"
          cp "$apk" dist/SG-Delivery-B885-Lane-Guidance-Then-TESTING.apk
          mkdir -p dist/evidence/unit-test-results dist/evidence/native-test-results
          cp -r app/build/test-results/testDebugUnitTest/. dist/evidence/unit-test-results/
          cp -r app/build/outputs/androidTest-results/connected/. dist/evidence/native-test-results/
          cp -r dist/native dist/evidence/
          cp dist/*.json dist/*.txt dist/SG-Delivery-B885-Testing-Report.md dist/evidence/
          cp docs/BUILD_885_TESTING.md dist/evidence/
          (cd dist/evidence && zip -qr ../B885-Verification-Evidence.zip .)
      - name: Publish separate TESTING prerelease only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=v1.4.73-b885-testing
          if gh release view "$tag" >/dev/null 2>&1; then exit 1; fi
          gh release create "$tag" dist/SG-Delivery-B885-Lane-Guidance-Then-TESTING.apk dist/SG-Delivery-B885-Testing-Report.md dist/B885-Verification-Evidence.zip \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title 'SG Delivery #885 TESTING – Lane Guidance & Then' --notes-file dist/SG-Delivery-B885-Testing-Report.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: B885-guidance-verification
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/
            app/build/reports/lint-results-debug.html
            dist/
