name: Publish SG Delivery Build 842 Remove Petrol Testing APK
on:
  push:
    branches: [feature/build-842-remove-petrol-testing]
    paths:
      - 'app/**'
      - '.github/workflows/build-842-remove-petrol-testing.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sg-delivery-b842-testing-publish
  cancel-in-progress: true
jobs:
  build-and-publish:
    if: github.ref == 'refs/heads/feature/build-842-remove-petrol-testing'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: python3 scripts/build_postal_seed.py
      - name: Verify all 21 real PNG resources
        run: |
          test "$(find app/src/main/res/drawable-nodpi -name 'nav_*.png' | wc -l)" -eq 21
      - name: Verify GPS Petrol-only change
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s = Path("app/src/main/java/com/izzyan/sgdeliveryplanner/BuiltInNavigationActivity.kt").read_text()
          assert 'showFuelStations' not in s
          assert 'LocalGasStation' not in s
          assert 'Text("Petrol"' not in s
          assert 'Nearby petrol stations' not in s
          assert 'session.location?.takeIf { it.hasSpeed() }' in s
          assert 'Column(Modifier.align(Alignment.BottomStart).padding(start = 12.dp, bottom = bottomInset)' in s
          PY
      - name: Unit tests, build, lint
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug lintDebug
      - name: Verify APK identity and signature
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | grep "package: name='com.izzyan.sgdeliveryplanner.b842test'"
          sha256sum "$apk"
      - uses: actions/upload-artifact@v4
        with:
          name: SG-Delivery-B842-Remove-Petrol-Testing-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish Testing prerelease APK only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          latest_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/feature/build-842-remove-petrol-testing" --jq .object.sha)"
          if [ "$GITHUB_SHA" != "$latest_sha" ]; then
            echo "Skipping obsolete testing APK; a newer #842 commit exists."
            exit 0
          fi
          tag=v1.4.30-b842-testing
          asset="$RUNNER_TEMP/SG-Delivery-B842-Remove-Petrol-Testing.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$asset"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$asset" --clobber
          else
            gh release create "$tag" "$asset" --target "$GITHUB_SHA" --prerelease --latest=false --title "SG Delivery Build #842 TESTING — Remove Petrol Button" --notes "Based on Build #841 Testing. Only GPS Petrol button, its icon, label and click handler removed; speed indicator stays anchored at the same position. Payment petrol deduction and all other features unchanged. Isolated testing application. No Official merge."
          fi
