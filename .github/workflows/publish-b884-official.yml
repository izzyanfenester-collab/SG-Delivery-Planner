name: Publish approved SG Delivery B884 Official Compact History Cards
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-b884-official.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sg-delivery-b884-official-publish
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        with: {packages: platform-tools, log-accepted-android-sdk-licenses: false}
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.13'}
      - name: Verify only approved B884 test app source and canonical Official version
        run: |
          python3 -m py_compile scripts/verify_b884_official.py
          python3 scripts/verify_b884_official.py source
      - name: Restore byte-identical B883 Official assets matched to B884 TESTING
        run: |
          set -euo pipefail
          curl -fL --retry 3 https://github.com/izzyanfenester-collab/SG-Delivery-Planner/releases/download/v1.4.71-b883/SG-Delivery-B883-Official.apk -o "$RUNNER_TEMP/B883-Official.apk"
          curl -fL --retry 3 https://github.com/izzyanfenester-collab/SG-Delivery-Planner/releases/download/v1.4.72-b884-testing-r2/SG-Delivery-B884-Compact-History-TESTING.apk -o "$RUNNER_TEMP/B884-Testing.apk"
          curl -fL --retry 3 https://github.com/izzyanfenester-collab/SG-Delivery-Planner/releases/download/v1.4.72-b884-testing-r2/B884-Verification-Evidence.zip -o "$RUNNER_TEMP/B884-Testing-Evidence.zip"
          python3 scripts/verify_b884_official.py restore "$RUNNER_TEMP/B883-Official.apk" "$RUNNER_TEMP/B884-Testing.apk" "$RUNNER_TEMP/B884-Testing-Evidence.zip"
      - name: Run all Android unit tests, lint and compile canonical Official APK
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug assembleRelease
      - name: Recover original protected SG Delivery Official signing key
        env:
          SG_DELIVERY_KEYSTORE_BASE64: ${{ secrets.SG_DELIVERY_KEYSTORE_BASE64 }}
          SG_DELIVERY_KEYSTORE_PASSWORD: ${{ secrets.SG_DELIVERY_KEYSTORE_PASSWORD }}
          SG_DELIVERY_KEY_ALIAS: ${{ secrets.SG_DELIVERY_KEY_ALIAS }}
          SG_DELIVERY_KEY_PASSWORD: ${{ secrets.SG_DELIVERY_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SG_DELIVERY_KEYSTORE_BASE64"
          test -n "$SG_DELIVERY_KEYSTORE_PASSWORD"
          test -n "$SG_DELIVERY_KEY_ALIAS"
          test -n "$SG_DELIVERY_KEY_PASSWORD"
          umask 077
          printf '%s' "$SG_DELIVERY_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sg-delivery-b884.jks"
          test -s "$RUNNER_TEMP/sg-delivery-b884.jks"
      - name: Sign B884 APK with unchanged Official certificate and verify in-place upgrade
        env:
          SG_DELIVERY_KEYSTORE_PASSWORD: ${{ secrets.SG_DELIVERY_KEYSTORE_PASSWORD }}
          SG_DELIVERY_KEY_ALIAS: ${{ secrets.SG_DELIVERY_KEY_ALIAS }}
          SG_DELIVERY_KEY_PASSWORD: ${{ secrets.SG_DELIVERY_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p dist
          bt="$ANDROID_HOME/build-tools/36.0.0"
          unsigned=app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$unsigned"
          "$bt/zipalign" -P 16 -f -v 4 "$unsigned" "$RUNNER_TEMP/b884-aligned.apk" >/dev/null
          "$bt/apksigner" sign --ks "$RUNNER_TEMP/sg-delivery-b884.jks" \
            --ks-key-alias "$SG_DELIVERY_KEY_ALIAS" --ks-pass env:SG_DELIVERY_KEYSTORE_PASSWORD \
            --key-pass env:SG_DELIVERY_KEY_PASSWORD \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --out dist/SG-Delivery-B884-Official.apk "$RUNNER_TEMP/b884-aligned.apk"
          "$bt/apksigner" verify --verbose --print-certs dist/SG-Delivery-B884-Official.apk | tee dist/signing-verification.txt
          "$bt/apksigner" verify --print-certs "$RUNNER_TEMP/B883-Official.apk" > "$RUNNER_TEMP/b883-signer.txt"
          grep -F 'Signer #1 certificate SHA-256 digest: b70d1c964fb4e59c6bc44aee694e25dd893fa77eb877a4b29646cf33786e3e99' "$RUNNER_TEMP/b883-signer.txt"
          grep -F 'Signer #1 certificate SHA-256 digest: b70d1c964fb4e59c6bc44aee694e25dd893fa77eb877a4b29646cf33786e3e99' dist/signing-verification.txt
          "$bt/aapt" dump badging "$RUNNER_TEMP/B883-Official.apk" | grep -F "package: name='com.izzyan.sgdeliveryplanner' versionCode='91' versionName='1.4.71-b883'"
          "$bt/aapt" dump badging dist/SG-Delivery-B884-Official.apk | grep -F "package: name='com.izzyan.sgdeliveryplanner' versionCode='92' versionName='1.4.72-b884'"
          "$bt/aapt" dump badging dist/SG-Delivery-B884-Official.apk | grep -F "application-label:'SG Delivery'"
          "$bt/zipalign" -c -P 16 -v 4 dist/SG-Delivery-B884-Official.apk >/dev/null
          python3 scripts/verify_b884_official.py verify "$RUNNER_TEMP/B883-Official.apk" "$RUNNER_TEMP/B884-Testing.apk" "$RUNNER_TEMP/B884-Testing-Evidence.zip" dist/SG-Delivery-B884-Official.apk dist
          cp -r app/build/test-results/testDebugUnitTest dist/unit-test-results
          cp app/build/reports/lint-results-debug.html dist/
          cp "$RUNNER_TEMP/B884-Testing-Evidence.zip" dist/Approved-B884-Testing-Evidence.zip
          (cd dist && zip -q -r B884-Official-Verification.zip B884-Official-acceptance.json SG-Delivery-B884-Official-Report.md signing-verification.txt lint-results-debug.html unit-test-results Approved-B884-Testing-Evidence.zip)
          sha256sum dist/SG-Delivery-B884-Official.apk
      - uses: actions/upload-artifact@v4
        with:
          name: B884-Official-Signed-APK-and-verification
          path: |
            dist/SG-Delivery-B884-Official.apk
            dist/B884-Official-Verification.zip
            dist/SG-Delivery-B884-Official-Report.md
          if-no-files-found: error
      - name: Publish approved B884 as latest stable Official app update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag=v1.4.72-b884
          if gh release view "$tag" >/dev/null 2>&1; then
            echo '::error::B884 Official already exists; refuse overwrite'
            exit 1
          fi
          test "$(gh api repos/izzyanfenester-collab/SG-Delivery-Planner/releases/latest --jq .tag_name)" = v1.4.71-b883
          gh release create "$tag" dist/SG-Delivery-B884-Official.apk dist/B884-Official-Verification.zip dist/SG-Delivery-B884-Official-Report.md \
            --target "$GITHUB_SHA" --latest \
            --title 'SG Delivery Build #884 Official – Compact History Cards' \
            --notes-file dist/SG-Delivery-B884-Official-Report.md
          test "$(gh api repos/izzyanfenester-collab/SG-Delivery-Planner/releases/latest --jq .tag_name)" = "$tag"
      - name: Erase temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/sg-delivery-b884.jks" "$RUNNER_TEMP/b884-aligned.apk"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: B884-Official-diagnostic-reports
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
            dist/B884-Official-acceptance.json
            dist/signing-verification.txt
