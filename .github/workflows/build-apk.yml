name: Build IZZ Delivery APK
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    # B875 must bundle its validated offline catalog and exact baseline assets.
    # Its dedicated workflow runs the full test/lint/build suite before publishing.
    if: github.ref != 'refs/heads/feature/build-875-road-speed-limit-testing'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Enable launcher
        run: chmod +x gradlew
      - name: Generate account-free Singapore postal index
        run: python3 scripts/build_postal_seed.py
      - name: Restore validated offline assets for road-speed integration tests
        if: hashFiles('scripts/verify_b875_official.py') != ''
        run: |
          set -euo pipefail
          curl -fL --retry 3 https://github.com/izzyanfenester-collab/SG-Delivery-Planner/releases/download/v1.4.63-b875-testing/SG-Delivery-B875-Road-Speed-Limit-TESTING.apk -o "$RUNNER_TEMP/B875-Testing.apk"
          curl -fL --retry 3 https://github.com/izzyanfenester-collab/SG-Delivery-Planner/releases/download/v1.4.63-b875-testing/B875-Verification-Evidence.zip -o "$RUNNER_TEMP/B875-testing-evidence.zip"
          python3 scripts/verify_b875_official.py restore "$RUNNER_TEMP/B875-Testing.apk" "$RUNNER_TEMP/catalog" "$RUNNER_TEMP/B875-testing-evidence.zip"
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest
      - name: Build and lint APK
        run: ./gradlew assembleDebug lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SG-Delivery-Planner-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
