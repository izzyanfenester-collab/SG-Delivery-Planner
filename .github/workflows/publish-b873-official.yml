name: Publish approved SG Delivery B873 Official
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-b873-official.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sg-delivery-b873-official-publish
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        with: {packages: platform-tools, log-accepted-android-sdk-licenses: false}
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.13'}
      - name: Verify exact user-approved B873 application source
        run: |
          set -euo pipefail
          git merge-base --is-ancestor ccb07e51c6eba272172021b9600f286d2fc24db2 HEAD
          git merge-base --is-ancestor 9925d2c81bf24fd03479ae9a08642081c4ad8215 HEAD
          git diff --exit-code 9925d2c81bf24fd03479ae9a08642081c4ad8215 HEAD -- app/src/main app/src/test
          python3 - <<'PY'
          import pathlib,subprocess
          approved='9925d2c81bf24fd03479ae9a08642081c4ad8215'
          touched=set(subprocess.check_output(['git','diff','--name-only',approved,'HEAD','--','app/src'],text=True).splitlines())
          assert touched=={'app/src/debug/res/values/strings.xml'},touched
          expected=subprocess.check_output(['git','show','ccb07e51c6eba272172021b9600f286d2fc24db2:app/src/debug/res/values/strings.xml'])
          assert pathlib.Path('app/src/debug/res/values/strings.xml').read_bytes()==expected
          before=subprocess.check_output(['git','show',approved+':app/build.gradle.kts'],text=True)
          expected=before.replace('versionCode = 78; versionName = "1.4.61-b873-testing"',
              'versionCode = 79; versionName = "1.4.61-b873"').replace('applicationIdSuffix = ".b873test"','applicationIdSuffix = ".testing"')
          assert pathlib.Path('app/build.gradle.kts').read_text()==expected
          PY
      - name: Restore all 209 byte-identical original recordings and camera PCM
        run: |
          set -euo pipefail
          curl -fL --retry 3 https://github.com/izzyanfenester-collab/SG-Delivery-Planner/releases/download/v1.4.60-b872/SG-Delivery-B872-Official.apk -o "$RUNNER_TEMP/B872.apk"
          python3 scripts/restore_b872_assets873.py "$RUNNER_TEMP/B872.apk"
          python3 scripts/build_postal_seed.py
      - name: Full regression tests, selected-order units, native UI rendering, lint and Official build
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug assembleRelease
      - name: Restore original Official signing key securely
        env:
          SG_DELIVERY_KEYSTORE_BASE64: ${{ secrets.SG_DELIVERY_KEYSTORE_BASE64 }}
          SG_DELIVERY_KEYSTORE_PASSWORD: ${{ secrets.SG_DELIVERY_KEYSTORE_PASSWORD }}
          SG_DELIVERY_KEY_ALIAS: ${{ secrets.SG_DELIVERY_KEY_ALIAS }}
          SG_DELIVERY_KEY_PASSWORD: ${{ secrets.SG_DELIVERY_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for key in SG_DELIVERY_KEYSTORE_BASE64 SG_DELIVERY_KEYSTORE_PASSWORD SG_DELIVERY_KEY_ALIAS SG_DELIVERY_KEY_PASSWORD; do
            if [[ -z "${!key:-}" ]]; then
              echo "::error::Missing protected signing secret: $key"
              exit 1
            fi
          done
          umask 077
          printf '%s' "$SG_DELIVERY_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sg-delivery-b873.jks"
          test -s "$RUNNER_TEMP/sg-delivery-b873.jks"
      - name: Sign Official APK and verify existing B872 upgrade identity
        env:
          SG_DELIVERY_KEYSTORE_PASSWORD: ${{ secrets.SG_DELIVERY_KEYSTORE_PASSWORD }}
          SG_DELIVERY_KEY_ALIAS: ${{ secrets.SG_DELIVERY_KEY_ALIAS }}
          SG_DELIVERY_KEY_PASSWORD: ${{ secrets.SG_DELIVERY_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          bt="$ANDROID_HOME/build-tools/36.0.0"
          unsigned=app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$unsigned"
          mkdir -p dist
          "$bt/zipalign" -P 16 -f -v 4 "$unsigned" "$RUNNER_TEMP/b873-aligned.apk" >/dev/null
          "$bt/apksigner" sign --ks "$RUNNER_TEMP/sg-delivery-b873.jks" \
            --ks-key-alias "$SG_DELIVERY_KEY_ALIAS" --ks-pass env:SG_DELIVERY_KEYSTORE_PASSWORD \
            --key-pass env:SG_DELIVERY_KEY_PASSWORD \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --out dist/SG-Delivery-B873-Official.apk "$RUNNER_TEMP/b873-aligned.apk"
          "$bt/apksigner" verify --verbose --print-certs dist/SG-Delivery-B873-Official.apk | tee dist/signing-verification.txt
          "$bt/apksigner" verify --print-certs "$RUNNER_TEMP/B872.apk" > "$RUNNER_TEMP/b872-cert.txt"
          grep -F 'Signer #1 certificate SHA-256 digest: b70d1c964fb4e59c6bc44aee694e25dd893fa77eb877a4b29646cf33786e3e99' "$RUNNER_TEMP/b872-cert.txt"
          grep -F 'Signer #1 certificate SHA-256 digest: b70d1c964fb4e59c6bc44aee694e25dd893fa77eb877a4b29646cf33786e3e99' dist/signing-verification.txt
          "$bt/aapt" dump badging dist/SG-Delivery-B873-Official.apk | grep -F "package: name='com.izzyan.sgdeliveryplanner' versionCode='79' versionName='1.4.61-b873'"
          "$bt/aapt" dump badging dist/SG-Delivery-B873-Official.apk | grep -F "application-label:'SG Delivery'"
          "$bt/zipalign" -c -P 16 -v 4 dist/SG-Delivery-B873-Official.apk >/dev/null
          python3 scripts/verify_b873_official.py "$RUNNER_TEMP/B872.apk" dist/SG-Delivery-B873-Official.apk dist
          cp app/build/reports/b873-ui/SG-Delivery-B873-Bottom-Panel.png dist/
          cp -r app/build/test-results/testDebugUnitTest dist/unit-test-results
          cp app/build/reports/lint-results-debug.html dist/
          cd dist
          zip -q -r B873-Official-Verification.zip B873-Official-acceptance.json B873-Official-layout-logs.txt B873-Official-camera-regression-logs.txt signing-verification.txt SG-Delivery-B873-Bottom-Panel.png unit-test-results lint-results-debug.html
          sha256sum SG-Delivery-B873-Official.apk
      - uses: actions/upload-artifact@v4
        with:
          name: B873-Official-Verified-APK-and-evidence
          path: dist/
          if-no-files-found: error
      - name: Publish owner-approved B873 as latest stable update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag=v1.4.61-b873
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Official B873 already exists; refusing overwrite"
            exit 1
          fi
          gh release create "$tag" dist/SG-Delivery-B873-Official.apk dist/B873-Official-Verification.zip \
            --target "$GITHUB_SHA" --latest \
            --title "SG Delivery Build #873 Official – GPS Unit, Block and Postal Panel" \
            --notes "Owner explicitly approved merging B873 TESTING (9925d2c81bf24fd03479ae9a08642081c4ad8215) into Official. Same approved application source and tests: actual selected-order unit beside verified block and postal, no guessed units, correct duplicate-postal handling, live destination label updates, 26sp ExtraBold responsive wrapping, 29sp ETA, retained Arrival/distance/duration/Delivery action. GPS NavigationSession remains byte-identical to B872. All 209 Panda Warrior MP3/PCM and 341 camera records remain byte-identical. Camera alerts/icons, smooth zoom, aggressive rerouting, theme palette, deliveries, history, payments, sharing, reports, update checker and saved-data schemas are unchanged. Canonical Official package and original signing certificate; versionCode 79/version 1.4.61-b873 supports in-place upgrade from Official B872. Full automated regression tests, native Compose layout tests, lint, assets, signing and 16KB alignment verified. Physical runner-device GPS/visual/audio/Bluetooth sessions have not been performed. Native panel rendering uses fixture data in simulated Android. Existing B872 camera-data limitations remain unchanged. Published as latest stable for Check for Update."
          test "$(gh api repos/izzyanfenester-collab/SG-Delivery-Planner/releases/latest --jq .tag_name)" = "$tag"
      - name: Remove temporary signing key and aligned APK
        if: always()
        run: rm -f "$RUNNER_TEMP/sg-delivery-b873.jks" "$RUNNER_TEMP/b873-aligned.apk"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: B873-Official-test-reports
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
            app/build/reports/b873-ui/
            dist/signing-verification.txt
