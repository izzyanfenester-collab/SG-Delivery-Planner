name: Publish SG Delivery Build 839 Premium Day Night Map Testing APK

on:
  push:
    branches:
      - feature/build-839-premium-day-night-map-testing
    paths:
      - 'app/**'
      - '.github/workflows/build-839-daynight-testing-release.yml'
  workflow_dispatch:

permissions:
  contents: write

# A newer commit must never be overwritten by an older concurrent CI job.
concurrency:
  group: sg-delivery-b839-daynight-testing-publish
  cancel-in-progress: true

jobs:
  build-and-publish:
    if: github.ref == 'refs/heads/feature/build-839-premium-day-night-map-testing'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build offline postal data
        run: python3 scripts/build_postal_seed.py
      - name: Run all Android unit tests and lint
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug lintDebug
      - name: Verify testing APK identity and signature
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionName = "1.4.27-b839-daynight-testing"' app/build.gradle.kts
          grep -q 'applicationIdSuffix = ".b839maptest"' app/build.gradle.kts
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | grep "package: name='com.izzyan.sgdeliveryplanner.b839maptest'"
          sha256sum "$apk"
      - name: Upload APK for Build 839 GPS testing
        uses: actions/upload-artifact@v4
        with:
          name: SG-Delivery-B839-DayNight-Map-Testing-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish downloadable prerelease APK (never Official)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Do not publish a stale APK even when GitHub runners finish out of order.
          latest_sha="$(gh api "repos/${GITHUB_REPOSITORY}/branches/feature/build-839-premium-day-night-map-testing" --jq .commit.sha)"
          if [ "$GITHUB_SHA" != "$latest_sha" ]; then
            echo "A newer Build #839 Day/Night commit exists. Skipping stale APK publication."
            exit 0
          fi
          tag="v1.4.27-b839-daynight-testing"
          asset="$RUNNER_TEMP/SG-Delivery-B839-DayNight-Map-Testing.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$asset"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$asset" --clobber
          else
            gh release create "$tag" "$asset" --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "SG Delivery Build #839 TESTING (Premium Day Night Maps)" \
              --notes "Testing APK based on the latest Build #839 Blue 3D Arrow Testing. Premium teal-blue Night and bright Day map colours via in-place MapLibre Liberty paint/style changes, sharper road labels with halos, persistent Day/Night/Auto with device local clock 07:00/19:00, no style reloading on theme toggle. All GPS, arrow and delivery data unchanged. Isolated app com.izzyan.sgdeliveryplanner.b839maptest coexists with Official and other Testing. Map asset availability offline remains limited to provider cache. On-device testing required. Not an Official update."
          fi
