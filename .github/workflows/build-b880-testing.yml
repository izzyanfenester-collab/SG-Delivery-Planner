name: B880 Compact GPS Controls TESTING
on:
  push:
    branches: [feature/build-880-compact-gps-controls-testing]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: b880-compact-gps-testing
  cancel-in-progress: true
jobs:
  build:
    if: github.ref == 'refs/heads/feature/build-880-compact-gps-controls-testing'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        with: {packages: platform-tools, log-accepted-android-sdk-licenses: false}
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.13'}
      - name: Verify exact B879 Official baseline and layout-only source changes
        run: python3 scripts/verify_b880_testing.py source
      - name: Restore byte-identical B879 Official bundled assets
        run: |
          set -euo pipefail
          curl -fL --retry 3 https://github.com/izzyanfenester-collab/SG-Delivery-Planner/releases/download/v1.4.67-b879/SG-Delivery-B879-Official.apk -o "$RUNNER_TEMP/B879-Official.apk"
          python3 scripts/verify_b880_testing.py restore "$RUNNER_TEMP/B879-Official.apk"
      - name: All JVM/Robolectric layout regressions, lint and isolated B880 APK
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug assembleDebug
      - name: Validate B880 TESTING APK and all original B879 assets
        run: |
          set -euo pipefail
          mkdir -p dist
          apk=app/build/outputs/apk/debug/app-debug.apk
          bt="$ANDROID_HOME/build-tools/36.0.0"
          "$bt/aapt" dump badging "$apk" | grep -F "package: name='com.izzyan.sgdeliveryplanner.b880test' versionCode='88' versionName='1.4.68-b880-testing'"
          "$bt/aapt" dump badging "$apk" | grep -F "application-label:'SG Delivery #880 TESTING'"
          "$bt/zipalign" -c -P 16 -v 4 "$apk" > dist/zipalign.txt
          "$bt/apksigner" verify --verbose --print-certs "$apk" > dist/signature.txt
          cp "$apk" dist/SG-Delivery-B880-Compact-GPS-TESTING.apk
          python3 scripts/verify_b880_testing.py verify "$RUNNER_TEMP/B879-Official.apk" "$apk" dist
          cp -r app/build/test-results/testDebugUnitTest dist/unit-test-results
          cp app/build/reports/lint-results-debug.html dist/
          (cd dist && zip -q -r B880-Verification-Evidence.zip B880-Verification.json zipalign.txt signature.txt unit-test-results lint-results-debug.html)
      - uses: actions/upload-artifact@v4
        with:
          name: B880-Compact-GPS-TESTING-APK-and-evidence
          path: |
            dist/SG-Delivery-B880-Compact-GPS-TESTING.apk
            dist/B880-Verification-Evidence.zip
          if-no-files-found: error
      - name: Publish isolated TESTING GitHub Release; Official unchanged
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag=v1.4.68-b880-testing
          if gh release view "$tag" >/dev/null 2>&1; then
            echo '::error::Testing release already exists; refusing overwrite'
            exit 1
          fi
          gh release create "$tag" dist/SG-Delivery-B880-Compact-GPS-TESTING.apk dist/B880-Verification-Evidence.zip \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title 'SG Delivery #880 TESTING – Compact GPS Controls & Relocated Speed Meters' \
            --notes 'B880 TESTING based strictly on signed B879 Official. All six original 65x61dp GPS right-side buttons are about 20% smaller at 52x49dp; icons 20dp, unchanged semi-transparent style and all original actions. Current Speed and matching Speed Limit are moved together to a separate fixed lower-left lane beside/below Settings, above the measured opaque bottom Arrival panel. Right-side controls may scroll on compact portrait screens while speed remains stationary. Exact B879 overspeed red numbers, Panda Warrior voice, ERP 106 records / 101 mapped locations, camera alerts, offline map, all reports, all customer data and 436 app assets remain unchanged. Full JVM tests and lint plus APK signature and alignment verified. Real Android UI visual and touch testing needed before Official promotion. DO NOT MERGE without explicit approval.'
          test "$(gh api repos/izzyanfenester-collab/SG-Delivery-Planner/releases/latest --jq .tag_name)" = v1.4.67-b879
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: B880-failure-and-test-reports
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
            dist/B880-Verification.json
