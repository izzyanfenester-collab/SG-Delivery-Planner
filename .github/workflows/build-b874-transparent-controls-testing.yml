name: B874 Transparent GPS Controls TESTING
on:
  push:
    branches: [feature/build-874-transparent-gps-controls-testing]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: b874-transparent-controls-testing
  cancel-in-progress: true
jobs:
  build:
    if: github.ref == 'refs/heads/feature/build-874-transparent-gps-controls-testing'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        with: {packages: platform-tools, log-accepted-android-sdk-licenses: false}
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.13'}
      - name: Enforce exact B873 baseline and background-only application change
        run: python3 scripts/verify_b874_testing.py source
      - name: Restore exact B873 app assets and all 209 original recordings
        run: |
          set -euo pipefail
          curl -fL --retry 3 https://github.com/izzyanfenester-collab/SG-Delivery-Planner/releases/download/v1.4.61-b873/SG-Delivery-B873-Official.apk -o "$RUNNER_TEMP/B873.apk"
          python3 scripts/verify_b874_testing.py restore "$RUNNER_TEMP/B873.apk"
      - name: Existing navigation, camera, voice, delivery and data regressions plus lint and APK
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug assembleDebug
      - name: Verify isolated TESTING APK, alignment, signature and unchanged assets
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          bt="$ANDROID_HOME/build-tools/36.0.0"
          "$bt/aapt" dump badging "$apk" | grep -F "package: name='com.izzyan.sgdeliveryplanner.b874test' versionCode='80' versionName='1.4.62-b874-testing'"
          "$bt/aapt" dump badging "$apk" | grep -F "application-label:'SG Delivery #874 TESTING'"
          "$bt/zipalign" -c -P 16 -v 4 "$apk" >/dev/null
          mkdir -p dist
          "$bt/apksigner" verify --verbose --print-certs "$apk" > dist/signing-verification.txt
          cp "$apk" dist/SG-Delivery-B874-Transparent-GPS-TESTING.apk
          python3 scripts/verify_b874_testing.py verify "$RUNNER_TEMP/B873.apk" "$apk" dist
          cp -r app/build/test-results/testDebugUnitTest dist/unit-test-results
          cp app/build/reports/lint-results-debug.html dist/
          cd dist
          zip -q -r B874-Verification-Evidence.zip B874-acceptance.json B874-source-audit.json signing-verification.txt unit-test-results lint-results-debug.html
      - uses: actions/upload-artifact@v4
        with:
          name: B874-Transparent-GPS-TESTING-APK-and-evidence
          path: dist/
          if-no-files-found: error
      - name: Publish separate TESTING prerelease without changing Official
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag=v1.4.62-b874-testing
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Testing release exists; refusing overwrite"
            exit 1
          fi
          gh release create "$tag" dist/SG-Delivery-B874-Transparent-GPS-TESTING.apk dist/B874-Verification-Evidence.zip \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "SG Delivery #874 TESTING – Transparent GPS Control Backgrounds" \
            --notes "Exact Official B873 baseline 91bb7dbe5295724640ed0ce6dfab9ea93a7e82ee. The only runtime change is the GpsControl container background: SGColors.Card for inactive controls and PremiumGold with the same Card alpha for active controls. Reuses the existing speedometer/speed-limit host 30 percent opacity; 55–65 percent fallback is unnecessary because the real baseline alpha is available. Follow/Route/Zoom+/Zoom−/Traffic/Settings keep identical dimensions, icons, full-opacity foreground colors, labels, spacing, position, selected/pressed logic and click handlers. No blur, new layer or dependency. All other application and test source unchanged. All original 209 MP3/PCM, camera and postal assets verified byte-for-byte against B873. Existing regression tests, lint, APK signature and 16KB alignment verified. Isolated .b874test package. Physical phone visual/day/night/2D/3D/control/GPS and GPU profiling have not been performed. NO OFFICIAL MERGE."
          test "$(gh api repos/izzyanfenester-collab/SG-Delivery-Planner/releases/latest --jq .tag_name)" = v1.4.61-b873
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: B874-test-reports
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
            dist/B874-acceptance.json
            dist/B874-source-audit.json
