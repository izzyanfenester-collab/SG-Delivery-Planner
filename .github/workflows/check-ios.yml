name: Check SG Delivery Native iOS
on:
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/check-ios.yml'
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/check-ios.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Build for iPhone Simulator without signing
        working-directory: ios
        run: xcodebuild -project SGDeliveryV3.xcodeproj -scheme SGDeliveryV3 -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
