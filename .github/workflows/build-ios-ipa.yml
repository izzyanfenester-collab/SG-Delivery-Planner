name: Build IZZ Delivery unsigned device IPA
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-device-ipa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  device-ipa:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Generate native project and branding icon
        run: |
          brew install xcodegen
          ./ios/scripts/generate-project.sh
      - name: Build unsigned Release app for iOS devices
        run: |
          xcodebuild \
            -project ios/IZZDelivery.xcodeproj \
            -scheme IZZDelivery \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ios/DeviceDerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            build
      - name: Validate device app and package unsigned IPA
        run: |
          python3 ios/scripts/package-device-ipa.py \
            ios/DeviceDerivedData/Build/Products/Release-iphoneos/IZZDelivery.app \
            ios/ipa-dist/IZZ_Delivery_unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: IZZ-Delivery-iOS-IPA
          path: ios/ipa-dist/IZZ_Delivery_unsigned.ipa
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
