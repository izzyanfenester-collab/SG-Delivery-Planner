name: Publish approved SG Delivery B876 Official ERP Gantry Icons
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-b876-official.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sg-delivery-b876-official-publish
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        with: {packages: platform-tools, log-accepted-android-sdk-licenses: false}
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.13'}
      - name: Verify owner-approved ERP source and canonical upgrade version
        run: python3 scripts/verify_b876_official.py source
      - name: Download verified B875 Official and approved B876 TESTING inputs
        run: |
          set -euo pipefail
          curl -fL --retry 3 https://github.com/izzyanfenester-collab/SG-Delivery-Planner/releases/download/v1.4.63-b875/SG-Delivery-B875-Official.apk -o "$RUNNER_TEMP/B875-Official.apk"
          curl -fL --retry 3 https://github.com/izzyanfenester-collab/SG-Delivery-Planner/releases/download/v1.4.64-b876-testing/SG-Delivery-B876-ERP-Gantry-TESTING.apk -o "$RUNNER_TEMP/B876-Testing.apk"
          curl -fL --retry 3 https://github.com/izzyanfenester-collab/SG-Delivery-Planner/releases/download/v1.4.64-b876-testing/B876-Verification-Evidence.zip -o "$RUNNER_TEMP/B876-Testing-Evidence.zip"
          python3 scripts/verify_b876_official.py restore "$RUNNER_TEMP/B875-Official.apk" "$RUNNER_TEMP/B876-Testing.apk" "$RUNNER_TEMP/B876-Testing-Evidence.zip"
      - name: Run full Android unit regressions, lint and unsigned Official APK compilation
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug assembleRelease
      - name: Restore original protected Official signing key
        env:
          SG_DELIVERY_KEYSTORE_BASE64: ${{ secrets.SG_DELIVERY_KEYSTORE_BASE64 }}
          SG_DELIVERY_KEYSTORE_PASSWORD: ${{ secrets.SG_DELIVERY_KEYSTORE_PASSWORD }}
          SG_DELIVERY_KEY_ALIAS: ${{ secrets.SG_DELIVERY_KEY_ALIAS }}
          SG_DELIVERY_KEY_PASSWORD: ${{ secrets.SG_DELIVERY_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SG_DELIVERY_KEYSTORE_BASE64"
          test -n "$SG_DELIVERY_KEYSTORE_PASSWORD"
          test -n "$SG_DELIVERY_KEY_ALIAS"
          test -n "$SG_DELIVERY_KEY_PASSWORD"
          umask 077
          printf '%s' "$SG_DELIVERY_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sg-delivery-b876.jks"
          test -s "$RUNNER_TEMP/sg-delivery-b876.jks"
      - name: Sign and verify in-place upgrade compatible B876 Official APK
        env:
          SG_DELIVERY_KEYSTORE_PASSWORD: ${{ secrets.SG_DELIVERY_KEYSTORE_PASSWORD }}
          SG_DELIVERY_KEY_ALIAS: ${{ secrets.SG_DELIVERY_KEY_ALIAS }}
          SG_DELIVERY_KEY_PASSWORD: ${{ secrets.SG_DELIVERY_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p dist
          bt="$ANDROID_HOME/build-tools/36.0.0"
          unsigned=app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$unsigned"
          "$bt/zipalign" -P 16 -f -v 4 "$unsigned" "$RUNNER_TEMP/b876-aligned.apk" >/dev/null
          "$bt/apksigner" sign --ks "$RUNNER_TEMP/sg-delivery-b876.jks" \
            --ks-key-alias "$SG_DELIVERY_KEY_ALIAS" --ks-pass env:SG_DELIVERY_KEYSTORE_PASSWORD \
            --key-pass env:SG_DELIVERY_KEY_PASSWORD \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --out dist/SG-Delivery-B876-Official.apk "$RUNNER_TEMP/b876-aligned.apk"
          "$bt/apksigner" verify --verbose --print-certs dist/SG-Delivery-B876-Official.apk | tee dist/signing-verification.txt
          "$bt/apksigner" verify --print-certs "$RUNNER_TEMP/B875-Official.apk" > "$RUNNER_TEMP/b875-signer.txt"
          grep -F 'Signer #1 certificate SHA-256 digest: b70d1c964fb4e59c6bc44aee694e25dd893fa77eb877a4b29646cf33786e3e99' "$RUNNER_TEMP/b875-signer.txt"
          grep -F 'Signer #1 certificate SHA-256 digest: b70d1c964fb4e59c6bc44aee694e25dd893fa77eb877a4b29646cf33786e3e99' dist/signing-verification.txt
          "$bt/aapt" dump badging dist/SG-Delivery-B876-Official.apk | grep -F "package: name='com.izzyan.sgdeliveryplanner' versionCode='84' versionName='1.4.64-b876'"
          "$bt/aapt" dump badging dist/SG-Delivery-B876-Official.apk | grep -F "application-label:'SG Delivery'"
          "$bt/zipalign" -c -P 16 -v 4 dist/SG-Delivery-B876-Official.apk >/dev/null
          python3 scripts/verify_b876_official.py verify "$RUNNER_TEMP/B875-Official.apk" "$RUNNER_TEMP/B876-Testing.apk" "$RUNNER_TEMP/B876-Testing-Evidence.zip" dist/SG-Delivery-B876-Official.apk dist
          cp -r app/build/test-results/testDebugUnitTest dist/unit-test-results
          cp app/build/reports/lint-results-debug.html dist/
          cp "$RUNNER_TEMP/B876-Testing-Evidence.zip" dist/Approved-B876-Testing-Evidence.zip
          (cd dist && zip -q -r B876-Official-Verification.zip B876-Official-acceptance.json signing-verification.txt lint-results-debug.html unit-test-results Approved-B876-Testing-Evidence.zip)
          sha256sum dist/SG-Delivery-B876-Official.apk
      - uses: actions/upload-artifact@v4
        with:
          name: B876-Official-Signed-APK-and-verification
          path: |
            dist/SG-Delivery-B876-Official.apk
            dist/B876-Official-Verification.zip
          if-no-files-found: error
      - name: Publish B876 as latest stable Official release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag=v1.4.64-b876
          if gh release view "$tag" >/dev/null 2>&1; then
            echo '::error::B876 Official release already exists; refusing overwrite'
            exit 1
          fi
          test "$(gh api repos/izzyanfenester-collab/SG-Delivery-Planner/releases/latest --jq .tag_name)" = v1.4.63-b875
          gh release create "$tag" dist/SG-Delivery-B876-Official.apk dist/B876-Official-Verification.zip \
            --target "$GITHUB_SHA" --latest \
            --title 'SG Delivery Build #876 Official – Singapore ERP Gantry Icons' \
            --notes 'Owner explicitly approved promotion of B876 ERP TESTING commit 3969e7c2290254d4c4ddc40ed45318b04bd410d8. Correct canonical app ID, versionCode 84 / 1.4.64-b876 and original Official signing certificate for in-place B875 update. 106 records from user Excel grouped into 101 geographical locations, exact source reference icon, offline map overlays and ERP display setting. No charges/operating status inferred, no ERP voice. Every one of 432 B875 app assets byte-identical; ERP assets match approved B876 TESTING. Full Android unit regression, lint, signature and 16KB zipalign checked. Approved B876 native MapLibre 2D/3D emulator renderer evidence is carried forward; no real-device driving or Bluetooth testing completed. All previous camera, speed-limit, voice, zoom, route, reporting and payment functionality preserved. Official update release published for in-app update checks.'
          test "$(gh api repos/izzyanfenester-collab/SG-Delivery-Planner/releases/latest --jq .tag_name)" = "$tag"
      - name: Clean up temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/sg-delivery-b876.jks" "$RUNNER_TEMP/b876-aligned.apk"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: B876-Official-diagnostic-reports
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
            dist/B876-Official-acceptance.json
            dist/signing-verification.txt
