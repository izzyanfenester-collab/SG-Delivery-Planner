name: Publish SG Delivery Build 851 Aggressive GPS Rerouting Testing APK
on:
  push:
    branches: [feature/build-851-aggressive-gps-rerouting-testing]
    paths:
      - 'app/**'
      - '.github/workflows/build-851-aggressive-gps-rerouting-testing.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sg-delivery-b851-testing-publish
  cancel-in-progress: true
jobs:
  build-and-publish:
    if: github.ref == 'refs/heads/feature/build-851-aggressive-gps-rerouting-testing'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: python3 scripts/build_postal_seed.py
      - name: Verify all 21 original supplied frameless PNG resources
        run: |
          python3 -m pip install 'CairoSVG==2.7.1' 'Pillow==11.3.0'
          python3 scripts/import_navigation_signs846.py --verify
      - name: Unit tests, build, lint
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug lintDebug
      - name: Verify APK identity and signature
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | grep "package: name='com.izzyan.sgdeliveryplanner.b851gpstest'"
          sha256sum "$apk"
      - uses: actions/upload-artifact@v4
        with:
          name: SG-Delivery-B851-GPS-Rerouting-Testing-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish Testing prerelease APK only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          latest_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/feature/build-851-aggressive-gps-rerouting-testing" --jq .object.sha)"
          if [ "$GITHUB_SHA" != "$latest_sha" ]; then
            echo "Skipping obsolete testing APK; a newer #851 commit exists."
            exit 0
          fi
          tag=v1.4.39-b851-gps-testing
          asset="$RUNNER_TEMP/SG-Delivery-B851-GPS-Rerouting-Testing.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$asset"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$asset" --clobber
          else
            gh release create "$tag" "$asset" --target "$GITHUB_SHA" --prerelease --latest=false --title "SG Delivery Build #851 TESTING — Aggressive GPS Rerouting" --notes "Based solely on Official #850, no cancelled WhatsApp Accessibility changes. Aggressive junction detection, immediate heading-aware reroute, latest request wins, rate-limit backoff, raw GPS while off-route, immediate route and maneuver updates. 1-second target not guaranteed; trace and mock routing tests, real-device latency required. Isolated GPS testing only."
          fi
