name: Validate and export SG Delivery B865 SPF source dataset
on:
  push:
    branches: [feature/build-865-camera-safety-testing]
    paths: ['scripts/build_spf_camera_seed.py','.github/workflows/validate-spf-865.yml']
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install beautifulsoup4
      - name: Parse and validate every SPF camera location
        run: python3 scripts/build_spf_camera_seed.py
      - uses: actions/upload-artifact@v4
        with:
          name: SPF-341-Verified-Camera-Snapshot
          path: app/src/main/assets/sg_enforcement_cameras.json
          if-no-files-found: error
      - name: Persist validated SPF snapshot to TESTING branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/sg_enforcement_cameras.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh validated B865 SPF camera snapshot (testing only)"
            git push origin HEAD:feature/build-865-camera-safety-testing
          fi
