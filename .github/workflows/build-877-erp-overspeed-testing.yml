name: B877 ERP Layer and Overspeed TESTING
on:
  push:
    branches: [feature/build-877-erp-overspeed-testing]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: b877-erp-overspeed-testing
  cancel-in-progress: true
jobs:
  build:
    if: github.ref == 'refs/heads/feature/build-877-erp-overspeed-testing'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        with: {packages: platform-tools, log-accepted-android-sdk-licenses: false}
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.13'}
      - name: Verify bounded source changes and exact Official baseline
        run: |
          python3 -m py_compile scripts/verify_erp_overspeed877.py
          python3 scripts/verify_erp_overspeed877.py source
      - name: Restore unchanged Official data and all 209 recordings
        run: |
          curl -fL --retry 3 https://github.com/izzyanfenester-collab/SG-Delivery-Planner/releases/download/v1.4.65-b877/SG-Delivery-B877-Official.apk -o "$RUNNER_TEMP/B877-Official.apk"
          python3 scripts/verify_erp_overspeed877.py restore "$RUNNER_TEMP/B877-Official.apk"
      - name: Full original regressions, new speed-state tests, lint and APK compilation
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
      - name: Enable emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Real native map, session GPS replay and offline MP3 playback
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot-save -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash scripts/run_erp_overspeed877.sh
      - name: Verify APK identity, signature, alignment and acceptance evidence
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          bt="$ANDROID_HOME/build-tools/36.0.0"
          "$bt/aapt" dump badging "$apk" | grep -F "package: name='com.izzyan.sgdeliveryplanner.b877erptest' versionCode='86' versionName='1.4.65-b877-erp-overspeed-testing'"
          "$bt/zipalign" -c -P 16 -v 4 "$apk" >/dev/null
          "$bt/apksigner" verify --verbose --print-certs "$apk" > dist/signing-verification.txt
          python3 scripts/verify_erp_overspeed877.py verify "$RUNNER_TEMP/B877-Official.apk" "$apk"
          cp "$apk" dist/SG-Delivery-B877-ERP-Overspeed-TESTING.apk
          cp -r app/build/test-results/testDebugUnitTest dist/unit-test-results
          cp -r app/build/outputs/androidTest-results/connected dist/native-test-results
          cp app/build/reports/lint-results-debug.html dist/
          (cd dist && zip -q -r B877-ERP-Overspeed-Verification.zip *.json *.txt *.md *.html unit-test-results native-test-results native)
      - uses: actions/upload-artifact@v4
        with:
          name: B877-ERP-Overspeed-TESTING-and-evidence
          path: |
            dist/SG-Delivery-B877-ERP-Overspeed-TESTING.apk
            dist/SG-Delivery-B877-ERP-Overspeed-Testing-Report.md
            dist/B877-ERP-Overspeed-Verification.zip
          if-no-files-found: error
      - name: Publish separate TESTING release and preserve Official
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "$(gh api repos/izzyanfenester-collab/SG-Delivery-Planner/releases/latest --jq .tag_name)" = v1.4.65-b877
          test "$(gh api repos/izzyanfenester-collab/SG-Delivery-Planner/git/ref/heads/main --jq .object.sha)" = 850dfe1f48b8e8f42ef607865ffd8e1ac6338ef3
          tag=v1.4.65-b877-erp-overspeed-testing
          if gh release view "$tag" >/dev/null 2>&1; then exit 1; fi
          gh release create "$tag" dist/SG-Delivery-B877-ERP-Overspeed-TESTING.apk dist/SG-Delivery-B877-ERP-Overspeed-Testing-Report.md dist/B877-ERP-Overspeed-Verification.zip \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title 'SG Delivery #877 TESTING – ERP Layer & Overspeed' --notes-file dist/SG-Delivery-B877-ERP-Overspeed-Testing-Report.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: B877-ERP-Overspeed-diagnostic-reports
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/
            dist/
