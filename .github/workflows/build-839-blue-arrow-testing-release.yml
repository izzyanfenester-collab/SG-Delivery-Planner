name: Publish SG Delivery Build 839 Blue 3D Arrow Testing APK

on:
  push:
    branches:
      - feature/build-839-blue-arrow-cornering-testing
    paths:
      - 'app/**'
      - '.github/workflows/build-839-blue-arrow-testing-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    if: github.ref == 'refs/heads/feature/build-839-blue-arrow-cornering-testing'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build offline postal data
        run: python3 scripts/build_postal_seed.py
      - name: Run all Android unit tests and lint
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug lintDebug
      - name: Verify testing APK identity and signature
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionName = "1.4.27-b839-arrow-testing"' app/build.gradle.kts
          grep -q 'applicationIdSuffix = ".b839arrowtest"' app/build.gradle.kts
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | grep "package: name='com.izzyan.sgdeliveryplanner.b839arrowtest'"
          sha256sum "$apk"
      - name: Upload APK for Build 839 GPS testing
        uses: actions/upload-artifact@v4
        with:
          name: SG-Delivery-B839-3D-Arrow-Testing-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish downloadable prerelease APK (never Official)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="v1.4.27-b839-arrow-testing"
          asset="$RUNNER_TEMP/SG-Delivery-B839-3D-Arrow-Testing.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$asset"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$asset" --clobber
          else
            gh release create "$tag" "$asset" --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "SG Delivery Build #839 TESTING (Blue 3D Arrow and Smooth Cornering)" \
              --notes "Testing APK only based on the latest Build #839 GPS Testing branch. Transparent beveled blue 3D arrow replaces yellow car; shortest-angle smoothed geographic GPS bearing blended with route curvature, native MapLibre camera synchronization, no extra APIs. Isolated debug package com.izzyan.sgdeliveryplanner.b839arrowtest installs separately from Official and prior #839 test. Road testing still required. Not an Official app update."
          fi
