name: Build SG Delivery B855 Home Coordinate Testing
on:
  push:
    branches: [feature/build-855-home-coordinate-testing]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: python3 scripts/build_postal_seed.py
      - name: Unit tests, build, lint
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug lintDebug
      - name: Export private packaging base
        run: |
          set -euo pipefail
          mkdir -p private-packaging
          cp app/build/outputs/apk/debug/app-debug.apk private-packaging/base.apk
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" private-packaging/
          cp "$ANDROID_HOME/build-tools/36.0.0/zipalign" private-packaging/
          cp "$ANDROID_HOME/build-tools/36.0.0/aapt" private-packaging/
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging private-packaging/base.apk | grep "package: name='com.izzyan.sgdeliveryplanner.b855test'"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify private-packaging/base.apk
      - name: Checkpoint road data for directional validation
        continue-on-error: true
        run: |
          curl --fail --max-time 30 --retry 1 'https://api.openstreetmap.org/api/0.6/map?bbox=103.7665,1.444,103.771,1.449' -o private-packaging/checkpoint.osm
      - uses: actions/upload-artifact@v4
        with:
          name: B855-Private-Packaging-Base
          path: private-packaging/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: B855-Verification-Reports
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
