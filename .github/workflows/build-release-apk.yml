name: Build Signed SG Delivery Release APK

# Only the owner can dispatch this on main; untrusted pull requests never see signing secrets.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'scripts/build_postal_seed.py'
      - '.github/workflows/build-release-apk.yml'

permissions:
  # The release job publishes signed APKs to public GitHub Releases for all runners.
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Enable launcher
        run: chmod +x gradlew
      - name: Generate account-free Singapore postal index
        run: python3 scripts/build_postal_seed.py
      - name: Require complete original Panda Warrior voice pack before release
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("app/src/main/assets/voicepacks/panda_warrior")
          assert (root / "manifest.json").is_file(), "Panda Warrior pack is missing; do not publish an incomplete Official APK."
          clips = json.loads((root / "manifest.json").read_text())["clips"]
          assert len(clips) == 67 and len({c["id"] for c in clips}) == 67
          for c in clips:
              assert c["file"] == "audio/" + c["id"] + ".mp3"
              assert (root / c["file"]).is_file() and (root / c["file"]).stat().st_size > 0
          assert len(list((root / "audio").glob("*.mp3"))) == 67
          PY
      - name: Verify unit tests and lint
        run: ./gradlew testDebugUnitTest lintDebug
      - name: Restore release keystore from protected secrets
        shell: bash
        env:
          SG_DELIVERY_KEYSTORE_BASE64: ${{ secrets.SG_DELIVERY_KEYSTORE_BASE64 }}
          SG_DELIVERY_KEYSTORE_PASSWORD: ${{ secrets.SG_DELIVERY_KEYSTORE_PASSWORD }}
          SG_DELIVERY_KEY_ALIAS: ${{ secrets.SG_DELIVERY_KEY_ALIAS }}
          SG_DELIVERY_KEY_PASSWORD: ${{ secrets.SG_DELIVERY_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for var in SG_DELIVERY_KEYSTORE_BASE64 SG_DELIVERY_KEYSTORE_PASSWORD SG_DELIVERY_KEY_ALIAS SG_DELIVERY_KEY_PASSWORD; do
            if [[ -z "${!var:-}" ]]; then
              echo "::error::Missing required GitHub Actions secret: $var"
              exit 1
            fi
          done
          umask 077
          printf '%s' "$SG_DELIVERY_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sg-delivery-release.jks"
          test -s "$RUNNER_TEMP/sg-delivery-release.jks"
      - name: Build signed release APK
        env:
          SG_DELIVERY_KEYSTORE_PATH: ${{ runner.temp }}/sg-delivery-release.jks
          SG_DELIVERY_KEYSTORE_PASSWORD: ${{ secrets.SG_DELIVERY_KEYSTORE_PASSWORD }}
          SG_DELIVERY_KEY_ALIAS: ${{ secrets.SG_DELIVERY_KEY_ALIAS }}
          SG_DELIVERY_KEY_PASSWORD: ${{ secrets.SG_DELIVERY_KEY_PASSWORD }}
        run: ./gradlew assembleRelease
      - name: Confirm release APK is signed and verify its identity
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk"
          echo "Release APK SHA-256:"
          sha256sum "$apk"
      - name: Upload signed APK (keystore NEVER uploaded)
        uses: actions/upload-artifact@v4
        with:
          name: SG-Delivery-Official-Signed-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish public official APK for runner updates
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-b([0-9]+)$ ]]; then
            echo "::error::Unexpected Android app versionName: $version"
            exit 1
          fi
          build=${BASH_REMATCH[1]}
          tag="v$version"
          asset="$RUNNER_TEMP/SG-Delivery-B${build}-Official.apk"
          cp app/build/outputs/apk/release/app-release.apk "$asset"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$asset" --clobber
          else
            gh release create "$tag" "$asset" --target "$GITHUB_SHA" \
              --title "SG Delivery Build #$build" \
              --notes "Official APK signed using the SG Delivery permanent release key. Runners can download and install without a GitHub account. Back up data before switching from a testing package."
          fi
          echo "Official runner APK: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag}"
      - name: Remove temporary keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/sg-delivery-release.jks"
