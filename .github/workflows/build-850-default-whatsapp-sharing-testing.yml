name: Publish SG Delivery Build 850 Default WhatsApp Sharing Testing APK
on:
  push:
    branches: [feature/build-850-default-whatsapp-sharing-testing]
    paths:
      - 'app/**'
      - '.github/workflows/build-850-default-whatsapp-sharing-testing.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sg-delivery-b850-testing-publish
  cancel-in-progress: true
jobs:
  build-and-publish:
    if: github.ref == 'refs/heads/feature/build-850-default-whatsapp-sharing-testing'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: python3 scripts/build_postal_seed.py
      - name: Verify all 21 original supplied frameless PNG resources
        run: |
          python3 -m pip install 'CairoSVG==2.7.1' 'Pillow==11.3.0'
          python3 scripts/import_navigation_signs846.py --verify
      - name: Unit tests, build, lint
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug lintDebug
      - name: Verify APK identity and signature
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | grep "package: name='com.izzyan.sgdeliveryplanner.b850test'"
          sha256sum "$apk"
      - uses: actions/upload-artifact@v4
        with:
          name: SG-Delivery-B850-WhatsApp-Sharing-Testing-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish Testing prerelease APK only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          latest_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/feature/build-850-default-whatsapp-sharing-testing" --jq .object.sha)"
          if [ "$GITHUB_SHA" != "$latest_sha" ]; then
            echo "Skipping obsolete testing APK; a newer #850 commit exists."
            exit 0
          fi
          tag=v1.4.38-b850-testing
          asset="$RUNNER_TEMP/SG-Delivery-B850-WhatsApp-Sharing-Testing.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$asset"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$asset" --clobber
          else
            gh release create "$tag" "$asset" --target "$GITHUB_SHA" --prerelease --latest=false --title "SG Delivery Build #850 TESTING — Default WhatsApp Sharing" --notes "Based on Official #849. Delivery Report preview Share Report and active Route Share Photo follow the existing Default WhatsApp preference. Explicit ACTION_SEND with original PNG/JPEG and read grants; fallback dialog offers other installed WhatsApp or Android share menu. Existing image generators, report layouts, Summary/History and Excel sharing unchanged. Isolated testing; no Official merge."
          fi
