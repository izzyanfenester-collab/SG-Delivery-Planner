name: B876 ERP Gantry Icons TESTING
on:
  push:
    branches: [feature/build-876-erp-gantry-testing]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: b876-erp-testing
  cancel-in-progress: true
jobs:
  build:
    if: github.ref == 'refs/heads/feature/build-876-erp-gantry-testing'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        with: {packages: platform-tools, log-accepted-android-sdk-licenses: false}
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.13'}
      - name: Enforce exact Official baseline and ERP-only source hooks
        run: python3 scripts/verify_b876_testing.py source
      - name: Restore exact Official app assets without changing imported ERP attachments
        run: |
          curl -fL --retry 3 https://github.com/izzyanfenester-collab/SG-Delivery-Planner/releases/download/v1.4.63-b875/SG-Delivery-B875-Official.apk -o "$RUNNER_TEMP/B875.apk"
          python3 scripts/verify_b876_testing.py restore "$RUNNER_TEMP/B875.apk"
      - name: Full regression tests, workbook precision checks, lint and APK compilation
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
      - name: Enable KVM for the real native renderer test
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native MapLibre offline 2D/3D, rotation, zoom, pixel size, shared-card and toggle acceptance
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot-save -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash scripts/run_erp_native876.sh
      - name: Verify isolated APK, signature, alignment and all source-data acceptance evidence
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          bt="$ANDROID_HOME/build-tools/36.0.0"
          "$bt/aapt" dump badging "$apk" | grep -F "package: name='com.izzyan.sgdeliveryplanner.b876test' versionCode='84' versionName='1.4.64-b876-testing'"
          "$bt/aapt" dump badging "$apk" | grep -F "application-label:'SG Delivery #876 TESTING'"
          "$bt/zipalign" -c -P 16 -v 4 "$apk" >/dev/null
          "$bt/apksigner" verify --verbose --print-certs "$apk" > dist/signing-verification.txt
          cp "$apk" dist/SG-Delivery-B876-ERP-Gantry-TESTING.apk
          python3 scripts/verify_b876_testing.py verify "$RUNNER_TEMP/B875.apk" "$apk" dist
          cp -r app/build/test-results/testDebugUnitTest dist/unit-test-results
          cp -r app/build/outputs/androidTest-results/connected dist/native-test-results
          cp app/build/reports/lint-results-debug.html dist/
          cp app/src/main/assets/sg_erp_manifest_876.json dist/
          cd dist
          zip -q -r B876-Verification-Evidence.zip *.json *.txt *.html unit-test-results native-test-results native-map
      - uses: actions/upload-artifact@v4
        with:
          name: B876-ERP-TESTING-APK-and-evidence
          path: dist/
          if-no-files-found: error
      - name: Publish separate TESTING prerelease and retain Official unchanged
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag=v1.4.64-b876-testing
          if gh release view "$tag" >/dev/null 2>&1; then
            echo '::error::Testing release already exists; refusing overwrite'
            exit 1
          fi
          gh release create "$tag" dist/SG-Delivery-B876-ERP-Gantry-TESTING.apk dist/B876-Verification-Evidence.zip \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title 'SG Delivery #876 TESTING – Singapore ERP Gantry Icons' \
            --notes 'Exact Official B875 baseline 095f988e255d30776aeaa4ff3271efdc4d4728a0. Imports every supplied ERP_Locations row: 106 records, 101 coordinate sites, five shared-coordinate groups, original ID/gantry/coordinate text/Google Maps URLs preserved. The actual attachment is blue and white and rectangular; its JPEG bytes and aspect ratio are preserved, with transparent marker surroundings, rather than inventing a red circular replacement. Independent native GeoJSON source/layer, constant 42dp sign width, viewport alignment, existing vehicle/route/camera priority, offline SQLite data, default-ON persistent visibility option and stationary-only information cards. No charges, charging status, operating hours, direction or ERP voice inferred. All 432 Official assets, 209 MP3/PCM, 341 cameras and speed-limit data unchanged. See evidence for full regression/workbook tests and actual native Android emulator map rendering, 2D/3D/rotation/day/night, shared-record selection and visibility controls. Native screenshots use a labelled local renderer harness, not a physical road drive. Physical runner-phone drive/GPU profiling not performed. Separate .b876test package. NO OFFICIAL MERGE.'
          test "$(gh api repos/izzyanfenester-collab/SG-Delivery-Planner/releases/latest --jq .tag_name)" = v1.4.63-b875
          test "$(gh api repos/izzyanfenester-collab/SG-Delivery-Planner/git/ref/heads/main --jq .object.sha)" = 095f988e255d30776aeaa4ff3271efdc4d4728a0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: B876-all-test-reports
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/
            dist/native-map/
            dist/B876-acceptance.json
