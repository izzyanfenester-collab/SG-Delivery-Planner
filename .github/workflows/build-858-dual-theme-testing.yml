name: Build B858 Dual Theme TESTING
on:
  push:
    branches: [feature/build-858-burgundy-silver-testing]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: python3 scripts/build_postal_seed.py
      - run: chmod +x gradlew && ./gradlew testDebugUnitTest assembleDebug
      - run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | grep -F "com.izzyan.sgdeliveryplanner.b858test"
          mkdir -p testing-apk
          cp app/build/outputs/apk/debug/app-debug.apk testing-apk/SG-Delivery-B858-Dual-Theme-TESTING.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SG-Delivery-B858-Dual-Theme-TESTING
          path: testing-apk/SG-Delivery-B858-Dual-Theme-TESTING.apk
