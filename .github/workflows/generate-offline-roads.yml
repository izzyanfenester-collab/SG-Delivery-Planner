name: Generate Singapore Offline Driving Road Graph
on:
  push:
    branches:
      - feature/build-830-offline-road-routing-foundation
    paths:
      - scripts/build_singapore_road_graph.py
      - .github/workflows/generate-offline-roads.yml
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * 0'
permissions:
  contents: write
jobs:
  build-road-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install graph processing dependencies
        run: python -m pip install --disable-pip-version-check 'osmium>=4,<6' 'shapely>=2,<3'
      - name: Download latest ODbL road data and CC-BY Singapore boundary
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-delay 10 \
            --output malaysia-singapore-brunei.osm.pbf \
            'https://download.geofabrik.de/asia/malaysia-singapore-brunei-latest.osm.pbf'
          python - <<'PY'
          import json, urllib.request
          endpoint='https://www.geoboundaries.org/api/current/gbOpen/SGP/ADM0/'
          with urllib.request.urlopen(endpoint, timeout=40) as response:
              metadata=json.load(response)
          url=metadata['gjDownloadURL']
          if not url.startswith('https://'):
              raise RuntimeError('Singapore boundary URL was not HTTPS')
          with urllib.request.urlopen(url,timeout=90) as response:
              boundary=json.load(response)
          if boundary.get('type') != 'FeatureCollection' or not boundary.get('features'):
              raise RuntimeError('Invalid country polygon')
          with open('singapore-boundary.geojson','w') as output:
              json.dump(boundary,output)
          PY
      - name: Build Singapore local-road graph and SHA manifest
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_singapore_road_graph.py \
            --osm malaysia-singapore-brunei.osm.pbf \
            --boundary singapore-boundary.geojson \
            --output singapore-road-graph.zip \
            --manifest manifest.json \
            --release-url 'https://github.com/${{ github.repository }}/releases/download/offline-sg-current/singapore-road-graph.zip'
          python - <<'PY'
          import json,zipfile
          data=json.load(open('manifest.json'))
          assert data['nodes']>10000 and data['arcs']>20000
          with zipfile.ZipFile('singapore-road-graph.zip') as z:
              assert z.testzip() is None
              assert set(['nodes.tsv','arcs.tsv','restrictions.tsv','metadata.json']).issubset(z.namelist())
          print('Validated',data)
          PY
      - name: Upload generated graph for testing and phone import
        uses: actions/upload-artifact@v4
        with:
          name: singapore-offline-road-graph
          path: |
            singapore-road-graph.zip
            manifest.json
          if-no-files-found: error
          retention-days: 21
      - name: Publish release only after official workflow is on main
        if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view offline-sg-current >/dev/null 2>&1; then
            gh release create offline-sg-current --title 'SG Delivery offline Singapore road graph' --notes 'ODbL OpenStreetMap data (Geofabrik); Singapore boundary geoBoundaries gbOpen CC-BY. Not live traffic.' --latest=false
          fi
          gh release upload offline-sg-current singapore-road-graph.zip manifest.json --clobber
