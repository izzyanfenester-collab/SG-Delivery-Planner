name: B865 Panda Warrior 209 Camera Voice TESTING
on:
  push:
    branches: [feature/build-865-panda-209-camera-voice-testing]
    paths:
      - 'voice_upload/**'
      - 'scripts/install_panda209_camera_865.py'
      - '.github/workflows/build-b865-panda209-camera-testing.yml'
      - 'app/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: b865-panda209-testing
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact uploaded ZIP
        run: |
          set -euo pipefail
          file=voice_upload/SG_Delivery_Panda_Warrior_V2_With_Camera_Alerts_209_Clips.zip
          test -s "$file" || { echo "::error::209 real MP3 ZIP missing; do not release synthetic voice APK"; exit 1; }
          echo "e8e3b56d9b0a9adc1d8b541134af8ac97905ba66e65e48336783f06e1a355c24  $file" | sha256sum -c -
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        with: {packages: platform-tools, log-accepted-android-sdk-licenses: false}
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.13'}
      - run: python3 scripts/build_postal_seed.py
      - name: Restore byte-verified original 185 Panda Warrior recordings
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/b857"
          gh release download v1.4.45-b857 --pattern SG-Delivery-B857-Official.apk --dir "$RUNNER_TEMP/b857"
          echo "f5d215ef9ca67f603c45da61f553254953fd2248a5a0a16c449c479f47467819  $RUNNER_TEMP/b857/SG-Delivery-B857-Official.apk" | sha256sum -c -
          python3 - <<'PY'
          import zipfile,pathlib,os,json
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'b857/SG-Delivery-B857-Official.apk'
          root='assets/voicepacks/panda_warrior_v2/'
          with zipfile.ZipFile(p) as z:
              assert len(json.loads(z.read(root+'manifest.json'))['clips'])==185
              for name in z.namelist():
                  if name.startswith(root) and not name.endswith('/'):
                      out=pathlib.Path('app/src/main')/name
                      out.parent.mkdir(parents=True,exist_ok=True)
                      out.write_bytes(z.read(name))
          PY
      - name: Install FFmpeg for authentic offline audio conversion
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1
      - name: Verify old recordings and install 24 original camera MP3 + offline PCM
        run: |
          command -v ffmpeg
          python3 scripts/install_panda209_camera_865.py voice_upload/SG_Delivery_Panda_Warrior_V2_With_Camera_Alerts_209_Clips.zip
      - name: Unit tests, lint and isolated Android testing APK
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug assembleDebug
      - name: Verify actual 209 MP3 in APK with original byte identity
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          bt="$ANDROID_HOME/build-tools/36.0.0"
          "$bt/aapt" dump badging "$apk" | grep -F "package: name='com.izzyan.sgdeliveryplanner.b865voice209test' versionCode='69' versionName='1.4.53-b865-camera209-testing'"
          "$bt/zipalign" -c -P 16 -v 4 "$apk" >/dev/null
          "$bt/apksigner" verify --verbose "$apk"
          python3 - <<'PY'
          import zipfile,json
          with zipfile.ZipFile('app/build/outputs/apk/debug/app-debug.apk') as a, zipfile.ZipFile('voice_upload/SG_Delivery_Panda_Warrior_V2_With_Camera_Alerts_209_Clips.zip') as z:
              assert a.testzip() is None
              nav=json.loads(a.read('assets/voicepacks/panda_warrior_v2/manifest.json'))['clips']
              cam=json.loads(a.read('assets/voicepacks/panda_warrior_camera/manifest.json'))['clips']
              assert len(nav)==185 and len(cam)==24 and len({v['id'] for v in nav+cam})==209
              for v in nav:
                  assert a.read('assets/voicepacks/panda_warrior_v2/'+v['file'])==z.read(v['file'])
              for v in cam:
                  assert a.read('assets/voicepacks/panda_warrior_camera/'+v['file'])==z.read(v['file'])
                  assert len(a.read('assets/voicepacks/panda_warrior_camera/audio_pcm/'+v['id']+'.pcm'))>10000
              assert json.loads(a.read('assets/sg_enforcement_cameras.json'))['record_count']==341
              print('Verified 209 original MP3 and 24 PCM included; no substituted voice')
          PY
          mkdir -p dist
          cp "$apk" dist/SG-Delivery-B865-Panda209-TESTING.apk
          sha256sum dist/SG-Delivery-B865-Panda209-TESTING.apk
      - uses: actions/upload-artifact@v4
        with:
          name: B865-Panda209-TESTING-APK
          path: dist/SG-Delivery-B865-Panda209-TESTING.apk
          if-no-files-found: error
      - name: Publish TESTING prerelease only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag=v1.4.53-b865-panda209-testing
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Existing TESTING tag; refuse overwrite"
            exit 1
          fi
          gh release create "$tag" dist/SG-Delivery-B865-Panda209-TESTING.apk \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "SG Delivery #865 TESTING – Panda Warrior 209 Camera Voice" \
            --notes "209 authentic user-supplied MP3 clips verified; 185 original navigation assets preserved byte-for-byte. 24 real camera warnings play through existing offline GPS audio engine. Conservative road/direction matching; absent verified speed limits or average-zone geometry are never fabricated. On-road/Bluetooth acceptance tests remain mandatory. NO OFFICIAL MERGE."
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: B865-Panda209-test-reports
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
