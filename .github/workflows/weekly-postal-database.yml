name: Refresh Singapore Postal Database (Three Sources)
on:
  schedule:
    - cron: '15 1 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/weekly-postal-database.yml
      - scripts/build_weekly_postals.py
permissions:
  contents: write
concurrency:
  group: sg-weekly-postal-database
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install OpenStreetMap data parser
        run: python -m pip install osmium
      - name: Test postal update integrity
        run: python -m unittest discover -s scripts -p 'test_weekly_postals.py' -v
      - name: Validate three public sources and publish compact database
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_weekly_postals.py
