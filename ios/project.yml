name: SGDeliveryV3
options:
  bundleIdPrefix: com.izzyan
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.4.2"
    CURRENT_PROJECT_VERSION: "7"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: "SG Delivery"
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Select proof-of-delivery and payment photos."
    SUPPORTS_MACCATALYST: NO
targets:
  SGDeliveryV3:
    type: application
    platform: iOS
    sources:
      - SGDelivery
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.izzyan.sgdelivery.v3
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    info:
      path: SGDelivery/Info.plist
      properties:
        CFBundleShortVersionString: "1.4.2"
        CFBundleVersion: "7"
        UIDeviceFamily: [1]
        CFBundleURLTypes: []
        UIRequiresFullScreen: false
