name: SGDelivery
options:
  bundleIdPrefix: com.izzyan
settings:
  base:
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: '16.0'
targets:
  SGDelivery:
    type: application
    platform: iOS
    deploymentTarget: '16.0'
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.izzyan.sgdelivery.ios
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: SG Delivery
        TARGETED_DEVICE_FAMILY: '1'
        CODE_SIGN_STYLE: Automatic
schemes:
  SGDelivery:
    build:
      targets:
        SGDelivery: all
